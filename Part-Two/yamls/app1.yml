apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress1
  template:
    metadata:
      labels:
        app: wordpress1
    spec:
      containers:
      - name: wordpress
        image: wordpress:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress1-service
spec:
  selector:
    app: wordpress1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
