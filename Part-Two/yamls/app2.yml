apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordpress2
  template:
    metadata:
      labels:
        app: wordpress2
    spec:
      containers:
      - name: wordpress
        image: wordpress:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress2-service
spec:
  selector:
    app: wordpress2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
